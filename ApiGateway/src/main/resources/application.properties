spring.application.name=APIGateway

server.port=8000

spring.cloud.gateway.server.webmvc.routes[0].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:2001
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/inventory/**

spring.cloud.gateway.server.webmvc.routes[1].id=shipping-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:2002
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/shipping/**